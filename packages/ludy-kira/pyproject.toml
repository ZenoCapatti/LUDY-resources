[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[project]
name = "ludy-kira"
version = "0.1.0"
description = "A small Symbolica-native Python wrapper around the external Kira executable"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PyYAML>=6.0",
    "symbolica>=1.2.0",
]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "ludy_kira"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ty>=0.0.65",
    "uv-build>=0.11.6,<0.12",
]
