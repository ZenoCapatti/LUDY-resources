[project]
name = "ludy"
version = "0.1.0"
description = "Reproducible notebooks and calculations for factorisable local unitarity"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gammaloop",
    "kirapy",
    "marimo",
    "splitting-kernels-notebook",
    "symbolica",
    "typst>=0.15,<0.16",
    "wigglystuff>=0.5.23",
]

[tool.uv]
config-settings-package = { gammaloop = { build-args = "--manifest-path crates/gammaloop-api/Cargo.toml" } }
override-dependencies = ["symbolica"]
package = false
python-downloads = "never"
python-preference = "only-system"

[tool.uv.sources]
gammaloop = { git = "https://github.com/alphal00p/gammaloop", rev = "4f44c86382977bade32a230801034b5c37faddbd" }
kirapy = { path = "packages/kirapy", editable = true }
splitting-kernels-notebook = { path = "calculations/splitting", editable = true }
symbolica = { git = "https://github.com/symbolica-dev/symbolica-community", rev = "4f62108b789ec33b25cb259696e6ff67780bab38" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ty>=0.0.65",
]
