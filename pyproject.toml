[project]
name = "ludy"
version = "0.1.0"
description = "Marimo notebooks backed by local GammaLoop and Symbolica Community builds"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gammaloop",
    "ludy-kira",
    "marimo",
    "symbolica",
    "typst>=0.15,<0.16",
    "wigglystuff>=0.5.23",
]

[tool.uv]
config-settings-package = { gammaloop = { build-args = "--manifest-path crates/gammaloop-api/Cargo.toml" } }
package = false
python-downloads = "never"
python-preference = "only-system"

[tool.uv.sources]
gammaloop = { path = "../gammaloop/main", editable = true, package = true }
ludy-kira = { path = "packages/ludy-kira", editable = true }
symbolica = { path = "../symbolica-community", editable = true, package = true }

[dependency-groups]
dev = [
    "ty>=0.0.65",
]
