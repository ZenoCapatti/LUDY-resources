[project]
name = "ludy-dy"
version = "0.1.0"
description = "Portable Marimo application for Drell-Yan reductions and analytic masters"
requires-python = ">=3.13,<3.14"
dependencies = [
    "kirapy",
    "marimo>=0.23.15",
    "symbolica @ git+https://github.com/alphal00p/symbolica.git@2e9345b13967cd214b8473f662fa1104d653d5a6",
    "typst>=0.15,<0.16",
]

[tool.uv]
package = false
python-downloads = "never"
python-preference = "only-system"

[tool.uv.extra-build-dependencies]
symbolica = ["maturin==1.14.1"]

[tool.uv.sources]
kirapy = { path = "../../../packages/kirapy", editable = true }

[dependency-groups]
build = [
    "maturin==1.14.1",
]
