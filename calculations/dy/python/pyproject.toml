[project]
name = "ludy-dy"
version = "0.1.0"
description = "Portable Marimo application for the Drell-Yan topology-1 Kira reduction"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ludy-kira",
    "marimo>=0.23.15",
]

[tool.uv]
package = false
python-downloads = "never"
python-preference = "only-system"

[tool.uv.sources]
ludy-kira = { path = "../../../packages/ludy-kira", editable = true }
